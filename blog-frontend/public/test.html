<!DOCTYPE html>
<html>
<head>
    <title>API测试页面</title>
</head>
<body>
    <h1>API连接测试</h1>
    <button onclick="testApi()">测试文章API</button>
    <div id="result"></div>

    <script>
        async function testApi() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '测试中...';
            
            try {
                console.log('发送请求到 /api/articles');
                const response = await fetch('/api/articles?page=1&page_size=10');
                console.log('收到响应:', response);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('响应数据:', data);
                    resultDiv.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                } else {
                    resultDiv.innerHTML = '错误: ' + response.status + ' ' + response.statusText;
                }
            } catch (error) {
                console.error('请求失败:', error);
                resultDiv.innerHTML = '请求失败: ' + error.message;
            }
        }
    </script>
</body>
</html>
